title = "hashctl gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Allow deterministic secret-like literals in redaction unit tests"
paths = [
  '''internal/hashctl/output_test\.go''',
]
regexTarget = "line"
regexes = [
  '''AccountKey=abc123SECRET==''',
  '''secret=AbCdEf0123456789AbCdEf0123456789AbCdEf01''',
]

[[allowlists]]
description = "Allow obviously-fake credential fixtures in success-output redaction tests (issue #3)"
paths = [
  '''internal/hashctl/redaction_test\.go''',
]
regexTarget = "line"
regexes = [
  '''ZmFrZXNpZw''',
  '''ZmFrZWtleQ''',
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9''',
]
