version: 2
updates:
  # Keep Go module dependencies current (stdlib-only today; guards against drift).
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore

  # Keep GitHub Actions current. Combined with SHA pinning, Dependabot bumps both
  # the pinned SHA and its version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
