name: "Copilot Setup Steps"

# Pre-configures the ephemeral environment the Copilot cloud agent runs in, so it
# mirrors local/CI: the pinned Go toolchain plus the offline, stdlib-only build.
# The job MUST be named `copilot-setup-steps` for Copilot to use it.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Pre-warm build (offline, stdlib-only)
        run: CGO_ENABLED=0 GOPROXY=off GOSUMDB=off go build ./...
