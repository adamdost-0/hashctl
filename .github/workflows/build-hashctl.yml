name: Build hashctl

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        run: python -m pip install -e ".[dev]"
      - run: GOPROXY=off GOSUMDB=off go test ./...
      - name: Run hashctl ↔ FastAPI contract harness
        run: ./scripts/test-hashctl-contract.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Read version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(./scripts/get-hashctl-version.sh)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION (tag: v$VERSION)"
      - name: Build and package
        run: ./scripts/package-hashctl.sh
        env:
          HASHCTL_VERSION: ${{ steps.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Verify artifact
        run: |
          artifact="artifacts/hashctl/hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          ls -la "$artifact" "$artifact.sha256"
          (cd artifacts/hashctl && shasum -a 256 -c "$(basename "$artifact").sha256")
      - name: Upload to release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="artifacts/hashctl/hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          checksum="${artifact}.sha256"
          TAG="${{ steps.version.outputs.tag }}"
          max_attempts=12
          sleep_seconds=10
          attempt=1
          until gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Release ${TAG} not found after $((max_attempts * sleep_seconds))s"
              exit 1
            fi
            echo "Release ${TAG} not available yet (attempt ${attempt}/${max_attempts}); retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done
          gh release upload "$TAG" "$artifact" "$checksum" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify release asset download
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HASHCTL_VERSION: ${{ steps.version.outputs.version }}
          HASHCTL_PLATFORM: ${{ matrix.goos }}-${{ matrix.goarch }}
        run: ./scripts/verify-hashctl-release.sh
