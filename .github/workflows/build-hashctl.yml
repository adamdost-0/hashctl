name: Build hashctl

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

# Release publishing is handled by release.yml (GoReleaser, tag-triggered).
# Least privilege: deny all permissions at the workflow level; grant per job below.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Clean stale build outputs
        run: rm -rf bin artifacts/hashctl
      - name: Run tests
        run: ./scripts/test-hashctl.sh
      - name: Run vet
        run: CGO_ENABLED=0 GOPROXY=off GOSUMDB=off go vet ./...
      - name: Run lint (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - name: Run standalone build
        run: HASHCTL_VERSION=ci ./scripts/build-hashctl.sh

  credential-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Run gitleaks credential scan (connected-side CI control)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  build:
    needs:
      - test
      - credential-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Clean stale build outputs
        run: rm -rf bin artifacts/hashctl
      - name: Read version
        id: version
        run: |
          VERSION="$(./scripts/get-hashctl-version.sh)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"
      - name: Build and package (cross-platform packaging smoke test)
        run: ./scripts/package-hashctl.sh
        env:
          HASHCTL_VERSION: ${{ steps.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Verify artifact
        run: |
          artifact="artifacts/hashctl/hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          ls -la "$artifact" "$artifact.sha256"
          (cd artifacts/hashctl && shasum -a 256 -c "$(basename "$artifact").sha256")
      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-platform name avoids collisions across the build matrix.
          name: hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            artifacts/hashctl/hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            artifacts/hashctl/hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
