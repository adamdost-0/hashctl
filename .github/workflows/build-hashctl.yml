name: Build hashctl

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

# Least privilege: deny all permissions at the workflow level; grant per job below.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Clean stale build outputs
        run: rm -rf bin artifacts/hashctl
      - name: Run tests
        run: ./scripts/test-hashctl.sh
      - name: Run vet
        run: CGO_ENABLED=0 GOPROXY=off GOSUMDB=off go vet ./...
      - name: Run lint (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "Unformatted files:"
            echo "$fmt_out"
            exit 1
          fi
      - name: Run standalone build
        run: HASHCTL_VERSION=ci ./scripts/build-hashctl.sh

  credential-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Run gitleaks credential scan (connected-side CI control)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  build:
    needs:
      - test
      - credential-scan
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for `gh release upload` on release events
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: Clean stale build outputs
        run: rm -rf bin artifacts/hashctl
      - name: Read version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(./scripts/get-hashctl-version.sh)
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION (tag: v$VERSION)"
      - name: Build and package
        run: ./scripts/package-hashctl.sh
        env:
          HASHCTL_VERSION: ${{ steps.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Verify artifact
        run: |
          artifact="artifacts/hashctl/hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          ls -la "$artifact" "$artifact.sha256"
          (cd artifacts/hashctl && shasum -a 256 -c "$(basename "$artifact").sha256")
      - name: Upload to release
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          artifact="artifacts/hashctl/hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          checksum="${artifact}.sha256"
          TAG="${{ steps.version.outputs.tag }}"
          max_attempts=12
          sleep_seconds=10
          attempt=1
          until gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Release ${TAG} not found after $((max_attempts * sleep_seconds))s"
              exit 1
            fi
            echo "Release ${TAG} not available yet (attempt ${attempt}/${max_attempts}); retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done
          gh release upload "$TAG" "$artifact" "$checksum" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Verify release asset download
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v'))
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HASHCTL_VERSION: ${{ steps.version.outputs.version }}
          HASHCTL_PLATFORM: ${{ matrix.goos }}-${{ matrix.goarch }}
        run: ./scripts/verify-hashctl-release.sh
