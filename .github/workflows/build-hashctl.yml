name: Build hashctl

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOPROXY=off GOSUMDB=off go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Read version
        id: version
        run: |
          VERSION=$(jq -r .version package.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and package
        run: ./scripts/package-hashctl.sh
        env:
          HASHCTL_VERSION: ${{ steps.version.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      - name: Verify artifact
        run: |
          artifact="artifacts/hashctl/hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz"
          ls -la "$artifact" "$artifact.sha256"
          (cd artifacts/hashctl && shasum -a 256 -c "$(basename "$artifact").sha256")
      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: hashctl-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            artifacts/hashctl/hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz
            artifacts/hashctl/hashctl-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256

  release-upload:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/hashctl
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r .version package.json)"
          TAG="v${VERSION}"
          max_attempts=12
          sleep_seconds=10
          attempt=1
          until gh release view "$TAG" >/dev/null 2>&1; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "Release ${TAG} not found after $((max_attempts * sleep_seconds))s"
              exit 1
            fi
            echo "Release ${TAG} not available yet (attempt ${attempt}/${max_attempts}); retrying in ${sleep_seconds}s..."
            sleep "$sleep_seconds"
            attempt=$((attempt + 1))
          done
          gh release upload "$TAG" artifacts/hashctl/*/* --clobber
