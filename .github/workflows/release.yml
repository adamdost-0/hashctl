name: Release

on:
  push:
    tags:
      - "v*" # e.g. v0.1.0, v1.0.0, v0.2.0-rc.1

# Deny all at the workflow level; the release job is granted least privilege below.
permissions: {}

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # OIDC token for build-provenance attestation
      attestations: write # store the Sigstore-backed attestation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Verify VERSION matches tag
        run: |
          file_version="$(./scripts/get-hashctl-version.sh)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${file_version}" != "${tag_version}" ]; then
            echo "VERSION file (${file_version}) does not match tag (${tag_version})" >&2
            echo "Bump VERSION and re-tag so they agree." >&2
            exit 1
          fi

      - name: Configure tag signature verification
        # Make the release signer's public key available so `git verify-tag` can
        # verify the tag. Fail closed with an actionable message if no signing
        # material is configured. See .github/COMPENSATING_CONTROLS.md.
        env:
          ALLOWED_SIGNERS: ${{ secrets.ALLOWED_SIGNERS }}
          TAG_SIGNING_PUBKEY: ${{ secrets.TAG_SIGNING_PUBKEY }}
        run: |
          set -e
          if [ -n "${ALLOWED_SIGNERS:-}" ]; then
            mkdir -p ~/.config/git
            printf '%s\n' "$ALLOWED_SIGNERS" > ~/.config/git/allowed_signers
            git config gpg.ssh.allowedSignersFile ~/.config/git/allowed_signers
            echo "Configured SSH allowed-signers for tag verification."
          elif [ -n "${TAG_SIGNING_PUBKEY:-}" ]; then
            printf '%s\n' "$TAG_SIGNING_PUBKEY" | gpg --import
            echo "Imported GPG public key for tag verification."
          else
            echo "Error: no tag-signing verification material is configured." >&2
            echo "Set the ALLOWED_SIGNERS (SSH) or TAG_SIGNING_PUBKEY (GPG) repository secret; see .github/COMPENSATING_CONTROLS.md." >&2
            exit 1
          fi

      - name: Verify tag is annotated and signed
        # Fail-closed enforcement that the release tag is annotated and signed.
        run: |
          set -e
          TAG_TYPE=$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "Error: release tag $GITHUB_REF_NAME must be an annotated tag, got $TAG_TYPE." >&2
            echo "Re-create it with: git tag -s -a $GITHUB_REF_NAME -m '...'" >&2
            exit 1
          fi
          if ! git verify-tag "$GITHUB_REF_NAME"; then
            echo "Error: release tag $GITHUB_REF_NAME is not signed or not verifiable." >&2
            echo "Ensure the ALLOWED_SIGNERS (SSH) or TAG_SIGNING_PUBKEY (GPG) repository secret matches the signing key; see .github/COMPENSATING_CONTROLS.md." >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is annotated and signed."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/hashctl-*-*.tar.gz
