name: Release

on:
  push:
    tags:
      - "v*" # e.g. v0.1.0, v1.0.0, v0.2.0-rc.1

# Deny all at the workflow level; the release job is granted least privilege below.
permissions: {}

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
      id-token: write # OIDC token for build-provenance attestation
      attestations: write # store the Sigstore-backed attestation
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0 # GoReleaser needs full history for the changelog
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Verify VERSION matches tag
        run: |
          file_version="$(./scripts/get-hashctl-version.sh)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${file_version}" != "${tag_version}" ]; then
            echo "VERSION file (${file_version}) does not match tag (${tag_version})" >&2
            echo "Bump VERSION and re-tag so they agree." >&2
            exit 1
          fi

      - name: Verify tag is annotated and signed
        run: |
          # Maintainers must make the signing key/allowed-signers available to the runner
          # (or rely on the repo tag-protection ruleset) for git verify-tag to pass.
          # This step is the fail-closed enforcement.
          set -e
          TAG_TYPE=$(git cat-file -t "$GITHUB_REF_NAME")
          if [ "$TAG_TYPE" != "tag" ]; then
            echo "Error: Release tag $GITHUB_REF_NAME must be an annotated tag, got $TAG_TYPE." >&2
            exit 1
          fi
          if ! git verify-tag "$GITHUB_REF_NAME"; then
            echo "Error: Release tag $GITHUB_REF_NAME is not properly signed or verifiable." >&2
            exit 1
          fi
          echo "Tag $GITHUB_REF_NAME is an annotated and signed tag."

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: dist/hashctl-*-*.tar.gz
